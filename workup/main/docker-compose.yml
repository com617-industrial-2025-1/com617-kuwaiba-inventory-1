services:
  db:
    image: pgrouting/pgrouting:15-3.3-3.4.1
    container_name: db
    restart: always
    environment:
      - POSTGRES_USER=osmuser
      - POSTGRES_PASSWORD=osmpass
      - POSTGRES_DB=osm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./container-fs/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5432 -U osmuser -d osm" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 60s

  importer:
    image: iboates/osm2pgsql:2.2.0
    container_name: importer
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./container-fs/data:/data
    environment:
      - PGHOST=db
      - PGUSER=osmuser
      - PGPASSWORD=osmpass
      - PGDATABASE=osm
    entrypoint: /bin/sh -c
    command: >
      "echo 'Starting osm2pgsql import...';
       osm2pgsql --create --slim --hstore /data/bittern_park.xml"

  pgadmin:
    image: dpage/pgadmin4:9.13.0
    container_name: pgadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: minad1234
      PGADMIN_SERVER_JSON_FILE: /pgadmin/servers.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./container-fs/pgadmin/:/pgadmin


  app:
    build:
      context: ./osm-to-kuwaiba
      dockerfile: Dockerfile
    container_name: app
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/osm
      SPRING_DATASOURCE_USERNAME: osmuser
      SPRING_DATASOURCE_PASSWORD: osmpass
        # Overiding csv path
      UPRN_CSV_PATH: /data/uprns.csv
    volumes:
      - ./container-fs/data:/data


volumes:
  postgres_data:
  pgadmin_data: