# JDBC connection string
spring.datasource.url=jdbc:postgresql://localhost:5432/osm
spring.datasource.username=osmuser
spring.datasource.password=osmpass
# None is used here instead of "update" as so hibernate doesn't touch the database schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Prints every sql query that is used to the console
spring.jpa.show-sql=true
# Formats the printed sql
spring.jpa.properties.hibernate.format_sql=true

uprn.csv.path=../container-fs/data/uprns.csv