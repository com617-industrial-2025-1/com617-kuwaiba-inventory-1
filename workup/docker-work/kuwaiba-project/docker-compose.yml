services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: fiberq_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: yourpassword
    ports:
      - "5050:80"
    depends_on:
      - postgis

  kuwaiba:
    image: neotropic/kuwaiba:v2.1-nightly
    container_name: kuwaiba
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - kuwaiba_data:/data/db

volumes:
  postgis_data:
  kuwaiba_data: